<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" role="img" aria-label="10minutesapple">
  <title>10minutesapple</title>
  <!-- "10min" ultra-bold -->
  <text
    x="0"
    y="34"
    font-family="Syne, system-ui, sans-serif"
    font-weight="800"
    font-size="34"
    fill="#F0F0F5"
    letter-spacing="-0.03em"
  >10min</text>
  <!-- "Apple" light weight -->
  <text
    x="117"
    y="34"
    font-family="Syne, system-ui, sans-serif"
    font-weight="400"
    font-size="34"
    fill="#F0F0F5"
    letter-spacing="-0.02em"
  >Apple</text>
  <!-- Accent dot between the two words -->
  <circle cx="110" cy="28" r="3" fill="#FF3D57"/>
</svg>
